<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>DBMS Study Material</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #f3f4f6; color: #111827; }
    header { padding: 22px clamp(16px, 4vw, 48px); background: #111827; color: white; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); }
    .sub { margin: 6px 0 0; color: #cbd5e1; font-size: 14px; }
    a { color: inherit; }
    .download { background: #facc15; color: #111827; text-decoration: none; font-weight: 700; padding: 11px 16px; border-radius: 10px; }
    main { width: min(1100px, calc(100% - 28px)); margin: 24px auto; }
    .viewer { overflow: hidden; border-radius: 14px; background: white; box-shadow: 0 8px 30px #11182718; }
    iframe { display: block; width: 100%; height: min(78vh, 900px); min-height: 560px; border: 0; }
    footer { text-align: center; padding: 18px; color: #6b7280; font-size: 13px; }
    @media (max-width: 600px) { iframe { min-height: 70vh; height: 70vh; } header { align-items: flex-start; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>DBMS Study Material</h1>
      <p class="sub">Queries on Operators · Set Theory Operators · PL/SQL</p>
    </div>
    <a class="download" href="/DBMS_OP_PLSQL_4.pdf" download>Download PDF ↓</a>
  </header>
  <main>
    <div class="viewer">
      <iframe src="/DBMS_OP_PLSQL_4.pdf" title="DBMS study material PDF">
        Your browser cannot display PDFs. <a href="/DBMS_OP_PLSQL_4.pdf">Download the PDF</a>.
      </iframe>
    </div>
  </main>
  <footer>DBMS Study Material · 9 pages</footer>
</body>
</html>
